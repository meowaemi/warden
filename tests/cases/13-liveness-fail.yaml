# Liveness probe always fails -> kubelet kills it, restarts, CrashLoopBackOff.
apiVersion: v1
kind: Pod
metadata:
  name: liveness-fail
  namespace: warden-test
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      livenessProbe:
        exec:
          command: ["false"]
        initialDelaySeconds: 3
        periodSeconds: 3
        failureThreshold: 1
