# Env refers to a ConfigMap that does not exist -> CreateContainerConfigError.
apiVersion: v1
kind: Pod
metadata:
  name: missing-configmap
  namespace: warden-test
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      env:
        - name: SETTING
          valueFrom:
            configMapKeyRef:
              name: does-not-exist
              key: setting
