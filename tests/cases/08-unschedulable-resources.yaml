# Requests more memory than any node has -> Pending, Unschedulable.
apiVersion: v1
kind: Pod
metadata:
  name: unschedulable-resources
  namespace: warden-test
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          memory: "1000Gi"
