# KNOWN GAP: readiness probe always fails. The container is Running but never
# Ready; there is no Reason, so warden currently does not report it.
apiVersion: v1
kind: Pod
metadata:
  name: readiness-fail
  namespace: warden-test
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      readinessProbe:
        exec:
          command: ["false"]
        periodSeconds: 5
