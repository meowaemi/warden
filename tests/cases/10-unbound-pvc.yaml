# Claim with a storage class that does not exist stays unbound
# -> Pending, Unschedulable ("unbound immediate PersistentVolumeClaims").
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: unbound
  namespace: warden-test
spec:
  storageClassName: does-not-exist
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: unbound-pvc
  namespace: warden-test
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: unbound
