# CONTROL: one-shot pod that finishes successfully (Completed).
# Warden must NOT report it.
apiVersion: v1
kind: Pod
metadata:
  name: control-completed
  namespace: warden-test
spec:
  restartPolicy: Never
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo done"]
