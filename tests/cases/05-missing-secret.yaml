# Env refers to a Secret that does not exist -> CreateContainerConfigError.
apiVersion: v1
kind: Pod
metadata:
  name: missing-secret
  namespace: warden-test
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      env:
        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              name: does-not-exist
              key: password
