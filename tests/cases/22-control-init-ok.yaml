# CONTROL: init container succeeds, then the main one runs.
# Warden must NOT report it.
apiVersion: v1
kind: Pod
metadata:
  name: control-init-ok
  namespace: warden-test
spec:
  initContainers:
    - name: init
      image: busybox:1.36
      command: ["sh", "-c", "echo init ok"]
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
