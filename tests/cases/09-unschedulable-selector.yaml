# No node has the required label -> Pending, Unschedulable.
apiVersion: v1
kind: Pod
metadata:
  name: unschedulable-selector
  namespace: warden-test
spec:
  nodeSelector:
    warden-test/does-not-exist: "true"
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
