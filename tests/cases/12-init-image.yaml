# Init container image cannot be pulled -> Init:ErrImagePull / ImagePullBackOff.
apiVersion: v1
kind: Pod
metadata:
  name: init-image
  namespace: warden-test
spec:
  initContainers:
    - name: init
      image: busybox:this-tag-does-not-exist
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
