# Init container fails -> Error / CrashLoopBackOff; the main one never starts.
apiVersion: v1
kind: Pod
metadata:
  name: init-crash
  namespace: warden-test
spec:
  initContainers:
    - name: init
      image: busybox:1.36
      command: ["sh", "-c", "echo init failing; exit 1"]
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
