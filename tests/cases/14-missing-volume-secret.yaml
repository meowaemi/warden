# KNOWN GAP: volume from a missing Secret. The pod stays in ContainerCreating
# (FailedMount event), which warden currently ignores.
apiVersion: v1
kind: Pod
metadata:
  name: missing-volume-secret
  namespace: warden-test
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: secret
          mountPath: /secret
  volumes:
    - name: secret
      secret:
        secretName: does-not-exist
