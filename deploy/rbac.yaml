# Permissions of an agent running inside its own cluster. The Role covers one
# namespace, so start the agent with -namespace=demo; nodes need the ClusterRole.
# Identity of the agent pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: warden-site
  namespace: demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: warden-site
  namespace: demo
rules:
  # Read problems and resolve pod owners.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["list"]
  # Execute commands.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "patch"]
---
# Gives the Role to the agent's ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: warden-site
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: warden-site
    namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: warden-site
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  # Nodes are cluster-wide.
  name: warden-site-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]
---
# Gives the ClusterRole to the agent's ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: warden-site-nodes
subjects:
  - kind: ServiceAccount
    name: warden-site
    namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: warden-site-nodes
